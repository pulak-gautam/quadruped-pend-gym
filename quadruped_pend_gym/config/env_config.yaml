#gym env params---
verbose: False 
reset_noise_scale: 0.01
camera_config: 
  trackbodyid: 1
  distance: 2
  elevation: -20
frame_skip: 2
sensitivity: 0.1 

action_buffer_l: 3
obs_buffer_l: 3

tipping_angle: 1.3  
tipping_base_angle: 1 


#quadruped params---
joint_names: [
          'FR_hip_joint'  ,
          'FR_thigh_joint',                            
          'FR_calf_joint' ,                          
          'FL_hip_joint'  ,                          
          'FL_thigh_joint',                          
          'FL_calf_joint' ,                          
          'RR_hip_joint'  ,
          'RR_thigh_joint',
          'RR_calf_joint' ,
          'RL_hip_joint'  ,
          'RL_thigh_joint',
          'RL_calf_joint' ,
          'pole_joint'    ,
          ]
stand_up_joint_pos: [
          0.00571868, 0.608813, -1.21763, -0.00571868, 0.608813, -1.21763,
          0.00571868, 0.608813, -1.21763, -0.00571868, 0.608813, -1.21763
          ]


#pendulum params---
set_pend_params: True
rho: 2710.0
h: 0.6 
r: 0.01

#reward scales--
rewards:
  kappa_gait_probs: 0.07
  gait_force_sigma: 100.0
  footswing_height: 0.09 
  gait_vel_sigma: 10.0
  sigma_rew_neg: 5
  tracking_sigma: 0.25  # tracking reward = exp(-error^2/sigma)
  tracking_sigma_lat: 0.25  # tracking reward = exp(-error^2/sigma)
  tracking_sigma_long: 0.25  # tracking reward = exp(-error^2/sigma)
  tracking_sigma_yaw: 0.25  # tracking reward = exp(-error^2/sigma)
  soft_dof_pos_limit: 1.0  # percentage of urdf limits, values above this limit are penalized
  soft_dof_vel_limit: 1.0
  soft_torque_limit: 1.0
  max_contact_force: 100.0  # forces above this value are penalized
  termination_reward: 0.0

reward_scales:
  pole_balance: 5.0
  orientation_control: 5.0
  tracking_lin_vel: 1.0
  tracking_ang_vel: 0.5

  lin_vel_z: -0.02
  ang_vel_xy: -0.001
  torques: -0.00001
  dof_acc: -2.5e-7

  tracking_contacts_shaped_force: 4.0
  tracking_contacts_shaped_vel: 4.0
  action_smoothness_1: -0.1
  action_smoothness_2: -0.1
  raibert_heuristic: -10.0

  dof_vel: -1.0e-4
  feet_slip: -0.04
  jump: 10.0
  feet_clearance_cmd_linear: -30.0
  collision: -5.0
  action_rate: -0.01

  orientation: 0.0
  hop_symmetry: 0.0
  feet_stumble: -0.0
  stand_still: -0.0
  termination: -0.0
  tracking_lin_vel_lat: 0.0
  tracking_lin_vel_long: 0.0
  tracking_contacts: 0.0
  tracking_contacts_shaped: 0.0
  energy: 0.0
  energy_expenditure: 0.0
  survival: 0.0
  dof_pos_limits: 0.0
  feet_contact_forces: 0.0
  base_motion: 0.0
  tracking_stance_width: -0.0
  tracking_stance_length: -0.0
  base_height: 0.0
  estimation_bonus: 0.0
  dof_pos: -0.0
  feet_air_time: 0.0
  feet_impact_vel: -0.0
  feet_clearance: -0.0
  feet_clearance_cmd: -0.0


normalization:
  clip_actions: 10.0